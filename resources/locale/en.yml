nodeloc-telegram:
    admin:
        settings:
            title: Telegram Settings
            description: Configure Telegram login, registration, and optional Telegram notification delivery for Flarum.

            field:
                botUsername: Bot Username
                botUsername_help: Enter the public username of your Telegram bot without the @ symbol. The bot domain must be configured in BotFather for your forum domain.
                botToken: Bot Token
                botToken_help: Enter the token generated by BotFather for the same bot username.
                enableNotifications: Enable Notifications
                enableNotifications_help: Ask users for permission to receive messages from the bot and add Telegram as a notification delivery method.

    forum:
        log_in_with_telegram_button: Log in with Telegram
        sign_up_with_telegram_button: Sign up with Telegram
        link_telegram_button: Link Telegram

        auth:
            continue: Continue
            failed: Telegram authorization failed.
            linked: Telegram account linked successfully.
            linked_to_another_user: This Telegram account is already linked to another user.

        settings:
            notify_by_telegram_heading: Telegram
            unblock_telegram_bot: It seems like you did not authorize or blocked the Telegram bot. Send a message to <a>{username}</a> on Telegram to re-enable notifications
